name: BoringCache validation
run-name: bigname ${{ inputs.phase || 'cold' }}
'on':
  push:
    branches:
    - boringcache-validation
    paths:
    - .github/workflows/boringcache-validation.yml
  workflow_dispatch:
    inputs:
      phase:
        description: Fresh rebuild or sequential real-source rolling run
        type: choice
        options:
        - cold
        - warm
        - seed
        - commit1
        - commit2
        - commit3
        default: cold
        required: true
      cli_version:
        description: Optional exact BoringCache CLI release override
        type: string
        default: ''
        required: false
permissions:
  contents: read
concurrency:
  group: prospect-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  benchmark:
    name: ${{ matrix.provider }} bigname ${{ inputs.phase || 'cold' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        provider:
        - github
        - boringcache
    permissions:
      contents: read
      id-token: write
    env:
      PROSPECT: bigname
      PROVIDER: ${{ matrix.provider }}
      PHASE: ${{ inputs.phase || 'cold' }}
      BIGNAME_TEST_DATABASE_URL: postgres://bigname:bigname@127.0.0.1:5432/bigname
      CARGO_INCREMENTAL: '0'
      RUST_VERSION: 1.93.1
      RUSTUP_TOOLCHAIN: 1.93.1
      RUSTC_WRAPPER: sccache
      SCCACHE_IDLE_TIMEOUT: '0'
      SCCACHE_GHA_ENABLED: ${{ matrix.provider == 'github' && 'true' || 'false' }}
    steps:
    - name: Select pinned source
      id: source
      shell: bash
      env:
        SOURCES: '{"cold": {"source_sha": "747c19b1e1295d8768f910b2fe0f9e0024613ebc", "upstream_sha": "13a20cbed469f82c238264e5bbfceb115adf6dd9"},
          "warm": {"source_sha": "747c19b1e1295d8768f910b2fe0f9e0024613ebc", "upstream_sha": "13a20cbed469f82c238264e5bbfceb115adf6dd9"},
          "seed": {"source_sha": "1ce926a38b7b68a457878b2e19dd9db53bc0c23f", "upstream_sha": "199d64f5b32aa1368e1e7862bd93e0c464d7408d",
          "branch": "boringcache-rolling-seed"}, "commit1": {"source_sha": "9b4d01765e4530d0265df31f7d4f45211ddbe5fe",
          "upstream_sha": "c595ec078d72ddd19c1fcd303bbdf89fd0d30276", "branch": "boringcache-rolling-1"}, "commit2":
          {"source_sha": "86842d9cda9846a7f905fa40057f631ee0540e08", "upstream_sha": "1e8e52d5228c1177438cad6bcdb711ac928985c9",
          "branch": "boringcache-rolling-2"}, "commit3": {"source_sha": "2afca324d9923800e724d25dab6608b7faf49a71",
          "upstream_sha": "13a20cbed469f82c238264e5bbfceb115adf6dd9", "branch": "boringcache-rolling-3"}}'
      run: |
        python - <<'PY'
        import json, os
        sources = json.loads(os.environ['SOURCES'])
        phase = os.environ['PHASE']
        source = sources[phase]
        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write('sha=' + source['source_sha'] + '\n')
        with open(os.environ['GITHUB_ENV'], 'a') as f:
            f.write('UPSTREAM_SHA=' + source['upstream_sha'] + '\n')
            f.write('COHORT=' + ('fresh' if phase in ('cold', 'warm') else 'rolling') + '\n')
            f.write('CACHE_MODE=' + ('--read-only' if phase == 'warm' else '--write') + '\n')
        PY
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ steps.source.outputs.sha }}
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: boringcache/benchmarks
        ref: 7c31b58b4c26cdc9b5639bb58081fb76ef6a3298
        path: .benchmark-harness
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      with:
        toolchain: 1.93.1
    - name: Install native build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends clang libclang-dev
    - uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd
      with:
        tool: nextest@0.9.143
    - name: Select compiler object namespace
      shell: bash
      run: |-
        echo "SCCACHE_GHA_VERSION=bigname-20260906-$COHORT" >> "$GITHUB_ENV"
        echo "SCCACHE_GHA_RW_MODE=$([ "$PHASE" = warm ] && echo READ_ONLY || echo READ_WRITE)" >> "$GITHUB_ENV"
    - name: Install shared compiler-cache version
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      with:
        version: v0.17.0
    - uses: ./.benchmark-harness/.github/actions/prospect-cli
      with:
        cli-version: ${{ inputs.cli_version }}
    - name: Compute phase-runner dependency-cache key
      id: phase_runner_cache_key
      run: |
        root_lock_sha="$(sha256sum Cargo.lock | cut -d' ' -f1)"
        e2e_lock_sha="$(sha256sum tests/e2e/Cargo.lock | cut -d' ' -f1)"
        prefix="bigname-20260906-${COHORT}-rust-${RUST_VERSION}-${root_lock_sha}-${e2e_lock_sha}"
        runner_arch="$(printf '%s' "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
        primary="${prefix}-phase-runner-${RUNNER_OS}-${runner_arch}"
        echo "prefix=$prefix" >>"$GITHUB_OUTPUT"
        echo "primary=$primary" >>"$GITHUB_OUTPUT"
        echo "phase-runner dependency-cache primary key: $primary"
    - name: Cache phase-runner Cargo dependencies
      id: phase_runner_cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        prefix-key: ${{ steps.phase_runner_cache_key.outputs.prefix }}
        shared-key: phase-runner
        add-job-id-key: false
        add-rust-environment-hash-key: false
        workspaces: . -> target
        cache-workspace-crates: false
        save-if: ${{ env.PHASE != 'warm' }}
      if: matrix.provider == 'github'
    - name: Measure GitHub workload
      if: matrix.provider == 'github'
      shell: bash
      run: python .benchmark-harness/scripts/prospects/measure-command.py build -- ./scripts/test-db -- cargo nextest
        run -p phase-runner -p bigname-ingest -p bigname-interpret -p bigname-content-hash -p bigname-benchmark-gate
        -p bigname-lookup -p bigname-project -p bigname-metrics --all-features --no-fail-fast --partition slice:1/3
    - name: Measure BoringCache workload
      if: matrix.provider == 'boringcache'
      shell: bash
      run: python .benchmark-harness/scripts/prospects/measure-command.py build -- ./scripts/test-db -- boringcache
        ci run --oidc-provider github-actions -- boringcache cargo "$CACHE_MODE" --fail-on-cache-error
    - name: Measure upstream doctests
      shell: bash
      run: python .benchmark-harness/scripts/prospects/measure-command.py doctests -- ./scripts/test-db -- cargo
        test -p phase-runner -p bigname-ingest -p bigname-interpret -p bigname-content-hash -p bigname-benchmark-gate
        -p bigname-lookup -p bigname-project -p bigname-metrics --all-features --doc
    - name: Record GitHub compiler statistics
      if: always() && matrix.provider == 'github'
      shell: bash
      run: sccache --show-stats --stats-format json > "$RUNNER_TEMP/prospect-evidence/sccache.json"
    - name: Retain benchmark evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: bigname-${{ matrix.provider }}-${{ env.PHASE }}
        path: ${{ runner.temp }}/prospect-evidence
        if-no-files-found: error
        retention-days: 14
        include-hidden-files: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bigname
          POSTGRES_USER: bigname
          POSTGRES_PASSWORD: bigname
          POSTGRES_INITDB_ARGS: --set=max_connections=300
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U bigname -d bigname" --health-interval 5s --health-timeout 5s --health-retries
          10
