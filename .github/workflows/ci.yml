name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

      - boringcache-parallel-validation
  workflow_dispatch:
    inputs:
      cli_version:
        description: Optional exact BoringCache CLI release
        type: string
        required: false
        default: ''
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  RUST_VERSION: 1.93.1
  FOUNDRY_VERSION: v1.7.1
  SCCACHE_GHA_ENABLED: "false"

  CARGO_INCREMENTAL: '0'
  CC: sccache cc
  CXX: sccache c++
  BIGNAME_CARGO_CACHE: '1'
  BORINGCACHE_ACCESS: write
  RUST_LOG: error,boring_cache_cli::storage_transfer=warn
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy,rustfmt

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.17.0
      - name: BoringCache Cargo dependencies
        uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: archive
          cache-profiles: dependencies
          trust-policy: publish
          fail-on-cache-error: true
      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo fmt (e2e workspace)
        run: cargo fmt --manifest-path tests/e2e/Cargo.toml -- --check

      - name: Test Rust source size classifier
        run: scripts/test-rust-file-size

      - name: Rust source size ratchet
        env:
          # merge_group.base_ref keeps the allowance ratchet enforced at the
          # queue's final gate, where strict up-to-date no longer forces a
          # fresh pull_request run against merge-time main.
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
        run: |
          BASE_REF="${BASE_REF#refs/heads/}"
          if { [ "$GITHUB_EVENT_NAME" = "pull_request" ] || [ "$GITHUB_EVENT_NAME" = "merge_group" ]; } && [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            ./scripts/check-rust-file-size --base-ref "refs/remotes/origin/${BASE_REF}"
          else
            ./scripts/check-rust-file-size
          fi

      - name: Prometheus rule fixtures parse with promtool
        env:
          PROMETHEUS_VERSION: 3.13.2
          PROMETHEUS_SHA256: 0e8c4d46101bd025ea8265e377d2caabc57f488fc1be1c367f37db69ea41be6f
        run: |
          archive="$RUNNER_TEMP/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          install_dir="$RUNNER_TEMP/prometheus-${PROMETHEUS_VERSION}.linux-amd64"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          printf '%s  %s\n' "$PROMETHEUS_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          promtool="$install_dir/promtool"
          "$promtool" --version
          "$promtool" --version | grep -F "version ${PROMETHEUS_VERSION}"
          (
            cd ops/monitoring/prometheus
            "$promtool" check rules phase-runner-alerts.yml
            "$promtool" check config phase-runner.yml
            "$promtool" test rules phase-runner-alerts.test.yml
          )

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep

      - name: API/storage query ownership
        run: |
          ./scripts/check-query-ownership
          (cd scripts && bash test-query-ownership)

      - name: Migration version guard
        run: ./scripts/check-migration-versions

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev

      - name: cargo check
        run: boringcache cargo "--$BORINGCACHE_ACCESS" --skip-save check --workspace --all-targets --all-features

      - name: cargo check (e2e workspace)
        run: boringcache cargo "--$BORINGCACHE_ACCESS" --skip-save check --manifest-path tests/e2e/Cargo.toml --locked --all-targets

      - name: cargo clippy (strict workspace packages)
        run: boringcache cargo "--$BORINGCACHE_ACCESS" --skip-restore --skip-save clippy --workspace --all-targets --all-features --exclude bigname-adapters --no-deps -- -D warnings

      # The adapter crate still carries pre-existing warning classes. Deny
      # every other warning here so new lint classes cannot silently widen the
      # baseline while those targeted classes are paid down.
      - name: cargo clippy (adapter warning-class baseline)
        run: >-
          boringcache cargo "--$BORINGCACHE_ACCESS" --skip-restore clippy -p bigname-adapters --all-targets --all-features -- -D warnings -A clippy::unusual-byte-groupings -A clippy::too-many-arguments -A clippy::needless-question-mark -A clippy::collapsible-if -A clippy::needless-borrows-for-generic-args -A clippy::explicit-auto-deref -A clippy::needless-borrow -A clippy::filter-map-bool-then -A clippy::match-like-matches-macro -A clippy::borrow-deref-ref -A clippy::needless-option-as-deref -A clippy::needless-return -A clippy::redundant-closure -A clippy::bool-assert-comparison -A clippy::cloned-ref-to-slice-refs

      - name: cargo clippy (e2e workspace)
        run: boringcache cargo "--$BORINGCACHE_ACCESS" --skip-restore clippy --manifest-path tests/e2e/Cargo.toml --locked --all-targets -- -D warnings

    permissions:
      contents: read
      id-token: write
  schema_v2:
    name: test (schema v2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bigname
          POSTGRES_USER: bigname
          POSTGRES_PASSWORD: bigname
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bigname -d bigname"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BIGNAME_TEST_DATABASE_URL: postgres://bigname:bigname@127.0.0.1:5432/bigname
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Apply and verify schema v2
        run: ./schema-v2/apply-check.sh

  test_shard:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api shard 1/3
            packages: "-p bigname-api"
            api_shard: 1
          - name: api shard 2/3
            packages: "-p bigname-api"
            api_shard: 2
          - name: api shard 3/3
            packages: "-p bigname-api"
            api_shard: 3
          - name: core
            packages: >-
              -p bigname-domain
              -p bigname-storage
              -p bigname-manifests
              -p bigname-adapters
              -p bigname-test-support
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bigname
          POSTGRES_USER: bigname
          POSTGRES_PASSWORD: bigname
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bigname -d bigname"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BIGNAME_DATABASE_URL: postgres://bigname:bigname@127.0.0.1:5432/bigname
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync pinned upstream checkouts
        if: matrix.api_shard
        run: |
          scripts/sync-refs
          scripts/sync-refs --check

      - name: Verify GraphQL oracle tooling (offline)
        if: matrix.api_shard
        run: |
          scripts/graphql-compat-oracle verify-fixtures --offline
          (cd scripts && bash test-graphql-compat-oracle)

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.17.0
      - name: BoringCache Cargo dependencies
        uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: archive
          cache-profiles: dependencies
          trust-policy: publish
          fail-on-cache-error: true
      - name: Sync pinned upstream checkouts
        if: matrix.name == 'core'
        run: |
          scripts/sync-refs
          scripts/sync-refs --check

      - name: Install cargo-nextest
        if: matrix.api_shard
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143

      - name: API tests
        if: matrix.api_shard
        run: boringcache cargo "--$BORINGCACHE_ACCESS" nextest run -p bigname-api --all-features --no-fail-fast --partition slice:${{ matrix.api_shard }}/3

      - name: cargo test
        if: matrix.name == 'core'
        run: boringcache cargo "--$BORINGCACHE_ACCESS" test ${{ matrix.packages }} --all-features

    permissions:
      contents: read
      id-token: write
  phase_runner_shard:
    name: test (phase-runner shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bigname
          POSTGRES_USER: bigname
          POSTGRES_PASSWORD: bigname
          POSTGRES_INITDB_ARGS: "--set=max_connections=300"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bigname -d bigname"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BIGNAME_TEST_DATABASE_URL: postgres://bigname:bigname@127.0.0.1:5432/bigname
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.17.0
      - name: BoringCache Cargo dependencies
        uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: archive
          cache-profiles: dependencies
          trust-policy: publish
          fail-on-cache-error: true
      - name: cargo nextest (slice ${{ matrix.shard }}/8)
        run: >-
          ./scripts/test-db -- boringcache cargo "--$BORINGCACHE_ACCESS" nextest run -p phase-runner -p bigname-ingest -p bigname-interpret -p bigname-content-hash -p bigname-benchmark-gate -p bigname-lookup -p bigname-project -p bigname-metrics --all-features --no-fail-fast --partition slice:${{ matrix.shard }}/8

      - name: cargo test (doctests)
        if: matrix.shard == 1
        run: >-
          ./scripts/test-db -- boringcache cargo "--$BORINGCACHE_ACCESS" --skip-restore test -p phase-runner -p bigname-ingest -p bigname-interpret -p bigname-content-hash -p bigname-benchmark-gate -p bigname-lookup -p bigname-project -p bigname-metrics --all-features --doc

    permissions:
      contents: read
      id-token: write
  phase_runner:
    name: test (phase-runner)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - phase_runner_shard
    if: always()
    steps:
      - name: Check phase-runner shards
        run: |
          if [ "${{ needs.phase_runner_shard.result }}" != "success" ]; then
            echo "phase-runner shards: ${{ needs.phase_runner_shard.result }}"
            exit 1
          fi

  e2e_build:
    name: build (e2e phase-runner)
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    outputs:
      artifact-name: ${{ steps.package.outputs.artifact-name }}
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: "sccache"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev binutils

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.17.0
      - name: BoringCache Cargo dependencies
        uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: archive
          cache-profiles: dependencies
          trust-policy: publish
          fail-on-cache-error: true
      - name: Sync pinned upstream checkouts
        run: |
          scripts/sync-refs
          scripts/sync-refs --check

      - name: Build and package phase-runner
        id: package
        run: |
          build_started="$(date +%s)"
          boringcache cargo "--$BORINGCACHE_ACCESS" build --locked --package phase-runner --bin phase-runner
          build_finished="$(date +%s)"

          package_started="$(date +%s)"
          package_dir="$GITHUB_WORKSPACE/target/bigname-e2e-package"
          upload_dir="$GITHUB_WORKSPACE/target/bigname-e2e-upload"
          mkdir -p "$package_dir" "$upload_dir"
          install -m 0755 target/debug/phase-runner "$package_dir/phase-runner"

          unstripped_bytes="$(stat -c %s target/debug/phase-runner)"
          strip --strip-debug "$package_dir/phase-runner"
          if readelf -SW "$package_dir/phase-runner" | grep -E '[[:space:]]\.debug_' |
            grep -Fv '.debug_gdb_scripts'; then
            echo "strip --strip-debug left DWARF data sections in the staged executable" >&2
            exit 1
          fi
          stripped_bytes="$(stat -c %s "$package_dir/phase-runner")"
          stripped_sha256="$(sha256sum "$package_dir/phase-runner" | cut -d' ' -f1)"
          (
            cd "$package_dir"
            sha256sum phase-runner >SHA256SUMS
          )
          {
            printf 'source SHA: %s\n' "$GITHUB_SHA"
            rustc -Vv
            cargo -V
            printf 'unstripped binary bytes: %s\n' "$unstripped_bytes"
            printf 'stripped binary bytes: %s\n' "$stripped_bytes"
            printf 'stripped binary SHA-256: %s\n' "$stripped_sha256"
          } >"$package_dir/BUILD-METADATA"

          tar_path="$upload_dir/phase-runner-e2e.tar"
          tar -C "$package_dir" -cf "$tar_path" phase-runner SHA256SUMS BUILD-METADATA
          artifact_bytes="$(stat -c %s "$tar_path")"
          if [ "$artifact_bytes" -gt 536870912 ]; then
            echo "phase-runner artifact is $artifact_bytes bytes; 512 MiB maximum is 536870912" >&2
            exit 1
          fi
          package_finished="$(date +%s)"

          reduction_percent="$(awk -v before="$unstripped_bytes" -v after="$stripped_bytes" \
            'BEGIN { printf "%.2f", (before - after) * 100 / before }')"
          echo "build-seconds=$((build_finished - build_started))" >>"$GITHUB_OUTPUT"
          echo "package-seconds=$((package_finished - package_started))" >>"$GITHUB_OUTPUT"
          echo "unstripped-bytes=$unstripped_bytes" >>"$GITHUB_OUTPUT"
          echo "stripped-bytes=$stripped_bytes" >>"$GITHUB_OUTPUT"
          echo "artifact-bytes=$artifact_bytes" >>"$GITHUB_OUTPUT"
          echo "stripped-sha256=$stripped_sha256" >>"$GITHUB_OUTPUT"
          echo "reduction-percent=$reduction_percent" >>"$GITHUB_OUTPUT"
          echo "artifact-name=phase-runner-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >>"$GITHUB_OUTPUT"

      - name: Upload phase-runner artifact
        id: artifact_upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact-name }}
          path: target/bigname-e2e-upload/phase-runner-e2e.tar
          compression-level: 1
          retention-days: 3
          if-no-files-found: error

      - name: Summarize phase-runner artifact
        run: |
          {
            echo "### e2e phase-runner artifact"
            echo
            echo "- Build command: ${{ steps.package.outputs.build-seconds }}s"
            echo "- Strip/package: ${{ steps.package.outputs.package-seconds }}s"
            echo "- Unstripped binary: ${{ steps.package.outputs.unstripped-bytes }} bytes"
            echo "- Stripped binary: ${{ steps.package.outputs.stripped-bytes }} bytes"
            echo "- Tar before action compression: ${{ steps.package.outputs.artifact-bytes }} bytes"
            echo "- Strip reduction: ${{ steps.package.outputs.reduction-percent }}%"
            echo "- Executable SHA-256: \`${{ steps.package.outputs.stripped-sha256 }}\`"
            echo "- Action digest: \`${{ steps.artifact_upload.outputs.artifact-digest }}\`"
          } >>"$GITHUB_STEP_SUMMARY"

    permissions:
      contents: read
      id-token: write
  e2e_shard:
    name: test (e2e shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    needs:
      - e2e_build
    # Start after the artifact and cache build; e2e results remain independently aggregated.
    if: ${{ !cancelled() && needs.e2e_build.result == 'success' }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bigname
          POSTGRES_USER: bigname
          POSTGRES_PASSWORD: bigname
          POSTGRES_INITDB_ARGS: "--set=max_connections=300"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bigname -d bigname"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BIGNAME_DATABASE_URL: postgres://bigname:bigname@127.0.0.1:5432/bigname
      BIGNAME_E2E_TEST_THREADS: "8"
      BIGNAME_E2E_SHARD: ${{ matrix.shard }}
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: "sccache"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.17.0
      - name: BoringCache Cargo and Foundry data
        uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: archive
          cache-profiles: dependencies,foundry
          trust-policy: publish
          fail-on-cache-error: true
      - name: Install foundry (anvil)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

          cache: false
      - name: Sync pinned upstream checkouts
        run: |
          scripts/sync-refs
          scripts/sync-refs --check

      - name: Download phase-runner artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.e2e_build.outputs.artifact-name }}
          path: target/bigname-e2e-download
          digest-mismatch: error

      - name: Verify phase-runner artifact
        run: |
          artifact_dir="$GITHUB_WORKSPACE/target/bigname-e2e-artifact"
          mkdir -p "$artifact_dir"
          tar -xf target/bigname-e2e-download/phase-runner-e2e.tar -C "$artifact_dir"
          (
            cd "$artifact_dir"
            sha256sum -c SHA256SUMS
            grep -Fx "source SHA: $GITHUB_SHA" BUILD-METADATA
            test -x phase-runner
            file phase-runner
            ldd phase-runner | tee dynamic-dependencies.txt
            if grep -F "not found" dynamic-dependencies.txt; then
              echo "phase-runner artifact has a missing dynamic dependency" >&2
              exit 1
            fi
          )
          echo "BIGNAME_E2E_CANONICAL_PHASE_RUNNER=$artifact_dir/phase-runner" >>"$GITHUB_ENV"

      - name: Run e2e shard ${{ matrix.shard }}/4
        env:
          BIGNAME_E2E_SHUTDOWN_EVIDENCE: ${{ runner.temp }}/native-api-shutdown
        run: tests/e2e/run-gate

      - name: Retain native API shutdown evidence
        if: ${{ always() && matrix.shard == 3 }}
        uses: actions/upload-artifact@v7
        with:
          name: native-api-shutdown
          path: ${{ runner.temp }}/native-api-shutdown
          if-no-files-found: warn
          retention-days: 3

    permissions:
      contents: read
      id-token: write
  production_image:
    name: build (production image)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      artifact-name: production-image-${{ github.run_id }}-${{ github.run_attempt }}
      image-id: ${{ steps.shutdown_image.outputs.imageid }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare production build metadata directory
        run: mkdir -p target
      - name: Build exact production image with BoringCache
        uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: docker
          trust-policy: publish
          fail-on-cache-error: true
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUST_VERSION: ${{ env.RUST_VERSION }}
      - name: Read production build image ID
        id: shutdown_image
        run: python3 -c 'import json, os; data=json.load(open("target/production-build.json")); image=data["default"]["containerimage.config.digest"]; assert image.startswith("sha256:"); print("imageid=" + image, file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      - name: Package exact production image
        env:
          IMAGE_ID: ${{ steps.shutdown_image.outputs.imageid }}
        run: |
          package_dir="$GITHUB_WORKSPACE/target/bigname-image-package"
          mkdir -p "$package_dir"
          actual_id="$(docker image inspect --format '{{.Id}}' "bigname-api-shutdown:$GITHUB_SHA")"
          test "$actual_id" = "$IMAGE_ID"
          actual_revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE_ID")"
          test "$actual_revision" = "$GITHUB_SHA"
          docker save "bigname-api-shutdown:$GITHUB_SHA" --output "$package_dir/production-image.tar"
          (
            cd "$package_dir"
            sha256sum production-image.tar >SHA256SUMS
            printf 'source SHA: %s\nimage ID: %s\n' "$GITHUB_SHA" "$IMAGE_ID" >BUILD-METADATA
          )

      - name: Upload exact production image
        uses: actions/upload-artifact@v7
        with:
          name: production-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/bigname-image-package
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

    permissions:
      contents: read
      id-token: write
  api_container_shutdown:
    name: test (API container shutdown)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs:
      - e2e_build
      - production_image
    if: ${{ !cancelled() && needs.e2e_build.result == 'success' && needs.production_image.result == 'success' }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bigname
          POSTGRES_USER: bigname
          POSTGRES_PASSWORD: bigname
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bigname -d bigname"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUSTC_WRAPPER: "sccache"
      BIGNAME_DATABASE_URL: postgres://bigname:bigname@127.0.0.1:5432/bigname
      BIGNAME_E2E_SHUTDOWN_SOURCE_SHA: ${{ github.sha }}
      BIGNAME_E2E_SHUTDOWN_EVIDENCE: ${{ github.workspace }}/target/api-container-shutdown
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev
      - name: Sync pinned references
        run: |
          scripts/sync-refs
          scripts/sync-refs --check
      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.17.0
      - name: BoringCache Cargo and Foundry data
        uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: archive
          cache-profiles: dependencies,foundry
          trust-policy: publish
          fail-on-cache-error: true
      - name: Download phase-runner artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.e2e_build.outputs.artifact-name }}
          path: target/bigname-e2e-download
          digest-mismatch: error

      - name: Verify phase-runner artifact
        run: |
          artifact_dir="$GITHUB_WORKSPACE/target/bigname-e2e-artifact"
          mkdir -p "$artifact_dir"
          tar -xf target/bigname-e2e-download/phase-runner-e2e.tar -C "$artifact_dir"
          (
            cd "$artifact_dir"
            sha256sum -c SHA256SUMS
            grep -Fx "source SHA: $GITHUB_SHA" BUILD-METADATA
            test -x phase-runner
            file phase-runner
            ldd phase-runner | tee dynamic-dependencies.txt
            if grep -F "not found" dynamic-dependencies.txt; then
              echo "phase-runner artifact has a missing dynamic dependency" >&2
              exit 1
            fi
          )
          echo "BIGNAME_E2E_CANONICAL_PHASE_RUNNER=$artifact_dir/phase-runner" >>"$GITHUB_ENV"

      - name: Download exact production image
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.production_image.outputs.artifact-name }}
          path: target/bigname-image-download
          digest-mismatch: error

      - name: Verify and load exact production image
        env:
          IMAGE_ID: ${{ needs.production_image.outputs.image-id }}
        run: |
          image_dir="$GITHUB_WORKSPACE/target/bigname-image-download"
          (
            cd "$image_dir"
            sha256sum -c SHA256SUMS
            grep -Fx "source SHA: $GITHUB_SHA" BUILD-METADATA
            grep -Fx "image ID: $IMAGE_ID" BUILD-METADATA
          )
          docker load --input "$image_dir/production-image.tar"

      - name: Prove exact-image API shutdown
        env:
          BIGNAME_E2E_SHUTDOWN_IMAGE: bigname-api-shutdown:${{ github.sha }}
          BIGNAME_E2E_SHUTDOWN_IMAGE_ID: ${{ needs.production_image.outputs.image-id }}
        run: scripts/test-container-shutdown
      - name: Retain shutdown evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-container-shutdown
          path: target/api-container-shutdown
          if-no-files-found: error

    permissions:
      contents: read
      id-token: write
  e2e:
    name: test (e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - e2e_build
      - production_image
      - e2e_shard
      - api_container_shutdown
    if: always()
    steps:
      - name: Check e2e builder and shards
        run: |
          if [ "${{ needs.production_image.result }}" != "success" ] ||
             [ "${{ needs.e2e_build.result }}" != "success" ] ||
             [ "${{ needs.e2e_shard.result }}" != "success" ] ||
             [ "${{ needs.api_container_shutdown.result }}" != "success" ]; then
            echo "image builder: ${{ needs.production_image.result }}"
            echo "API container: ${{ needs.api_container_shutdown.result }}"
            echo "e2e builder:   ${{ needs.e2e_build.result }}"
            echo "e2e shards:    ${{ needs.e2e_shard.result }}"
            exit 1
          fi

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - schema_v2
      - test_shard
      - phase_runner
      - e2e
    if: always()
    steps:
      - name: Check test shards
        run: |
          if [ "${{ needs.schema_v2.result }}" != "success" ]; then
            echo "schema v2 finished with result: ${{ needs.schema_v2.result }}"
            exit 1
          fi
          if [ "${{ needs.test_shard.result }}" != "success" ]; then
            echo "test shards finished with result: ${{ needs.test_shard.result }}"
            exit 1
          fi
          if [ "${{ needs.phase_runner.result }}" != "success" ]; then
            echo "phase-runner finished with result: ${{ needs.phase_runner.result }}"
            exit 1
          fi
          if [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "e2e finished with result: ${{ needs.e2e.result }}"
            exit 1
          fi

  artifacts-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bigname
          POSTGRES_USER: bigname
          POSTGRES_PASSWORD: bigname
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bigname -d bigname"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BIGNAME_DATABASE_URL: postgres://bigname:bigname@127.0.0.1:5432/bigname
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.17.0
      - name: BoringCache Cargo dependencies
        uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: archive
          cache-profiles: dependencies
          trust-policy: publish
          fail-on-cache-error: true
      - name: Fetch smoke dependencies
        run: |
          cargo fetch --locked
          docker pull caddy:2-alpine

      - name: Sync upstream refs
        run: scripts/sync-refs

      - name: Initialize phase schema
        run: boringcache cargo "--$BORINGCACHE_ACCESS" --skip-save run --locked -p phase-runner --bin phase-runner -- init-schema

      - name: Build API for offline smoke checks
        run: boringcache cargo "--$BORINGCACHE_ACCESS" --skip-restore build --locked -p bigname-api --bin bigname-api
      - name: release smoke gate (no network)
        run: ./scripts/release-smoke --no-network

      - name: rollback smoke gate (no network)
        run: ./scripts/rollback-smoke --no-network

    permissions:
      contents: read
      id-token: write
  manager-graphql-compat:
    # Guards that bigname's GraphQL schema still serves every field the ENS
    # Manager's operations ask for. Validates the Manager's committed operation
    # documents (pulled from apps-monorepo) against bigname's committed SDL
    # fixture. This is a subset check ("does bigname serve what the Manager
    # needs"), not a schema-to-schema diff — bigname is deliberately a subset,
    # so a diff would be all noise. A breaking schema change (removed/renamed
    # field the Manager reads) fails this job; adding or removing a
    # bigname-private field the Manager never reads does not.
    name: Manager GraphQL compat
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GitHub withholds repository secrets (except GITHUB_TOKEN) from
    # fork-originated pull_request runs, so the private apps-monorepo checkout
    # below cannot authenticate on external-fork PRs. Skip the job cleanly for
    # those instead of failing at checkout; it still runs for same-repo
    # branches and on every push to main, so a fork-merged regression is
    # caught on main immediately. (Skipped jobs satisfy required checks, so
    # making this check required would not block external contributors.)
    # merge_group runs are skipped for the same reason: a queued fork PR's
    # unmerged code would otherwise execute with the private-repo token before
    # any merge happens. Same-repo changes were checked at PR time; queued
    # fork changes stay covered by the post-merge run on main, unchanged.
    if: github.repository == 'ensdomains/bigname' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    steps:
      - name: Checkout bigname
        uses: actions/checkout@v4

      - name: Checkout Manager operation documents
        uses: actions/checkout@v4
        with:
          repository: ensdomains/apps-monorepo
          # Pinned deliberately so bigname CI does not flake red on every
          # Manager edit; bump this when the Manager's indexer documents change.
          ref: 759860f5acc62ea287b0feefa23c0d17aeb862a9
          # apps-monorepo is private; this checkout needs a fine-grained PAT /
          # GitHub App token with contents:read on ensdomains/apps-monorepo.
          token: ${{ secrets.APPS_MONOREPO_READ_TOKEN }}
          path: apps-monorepo
          # Only the operation documents are needed — keep the checkout minimal.
          sparse-checkout: packages/indexer/documents
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Manager operations against bigname schema
        run: |
          # The generated-style Domain roots require two pinned Manager declaration updates.
          # Assert that these are the only raw validation differences, then validate every
          # unchanged field selection through a temporary declaration overlay until that
          # coordination lands.
          set +e
          raw_validation="$(npx -y -p @graphql-inspector/cli@6.0.8 -p graphql@16.14.2 graphql-inspector validate \
            'apps-monorepo/packages/indexer/documents/**/*.graphql' \
            apps/api/src/tests/fixtures/subgraph_schema.graphql 2>&1)"
          raw_status=$?
          set -e
          printf '%s\n' "$raw_validation"
          test "$raw_status" -le 1
          test "$(printf '%s\n' "$raw_validation" | grep -c 'Detected 2 invalid documents')" -eq 1
          test "$(printf '%s\n' "$raw_validation" | grep -Fc 'Variable $id of type String! used in position expecting type ID!.')" -eq 1
          test "$(printf '%s\n' "$raw_validation" | grep -Fc 'Variable $where of type DomainFilter! used in position expecting type Domain_filter.')" -eq 1
          unexpected="$(printf '%s\n' "$raw_validation" | sed -n '/\[log\]  - /p' | grep -Fv -e 'Variable $id of type String! used in position expecting type ID!.' -e 'Variable $where of type DomainFilter! used in position expecting type Domain_filter.' || true)"
          test -z "$unexpected"
          compat_dir="$(mktemp -d)"
          cp -R apps-monorepo/packages/indexer/documents "$compat_dir/documents"
          find "$compat_dir/documents" -type f -name '*.graphql' \
            -exec sed -i 's/\$id: String!/\$id: ID!/g' {} +
          domains_document="$compat_dir/documents/queries/Domains.graphql"
          sed -i 's/\$where: DomainFilter!/\$where: Domain_filter!/' "$domains_document"
          test "$(grep -rlF '$where: Domain_filter!' "$compat_dir/documents" | wc -l)" -eq 1
          npx -y -p @graphql-inspector/cli@6.0.8 -p graphql@16.14.2 graphql-inspector validate \
            "$compat_dir/documents/**/*.graphql" \
            apps/api/src/tests/fixtures/subgraph_schema.graphql
