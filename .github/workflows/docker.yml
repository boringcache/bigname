name: Docker Image

on:
  push:
    branches:
      - boringcache-validation
  workflow_dispatch:
    inputs:
      cli_version:
        description: Optional exact BoringCache CLI release
        type: string
        required: false
        default: ""
  workflow_run:
    workflows:
      - CI
    branches:
      - main
      - boringcache-validation
    types:
      - completed

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  RUST_VERSION: 1.93.1

jobs:
  publish:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.repository == 'boringcache/bigname') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Resolve image metadata
        id: image
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          short_sha="${HEAD_SHA::7}"
          {
            echo "name=$image"
            echo "sha=$HEAD_SHA"
            echo "tag=$short_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.repository == 'ensdomains/bigname' && github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image with BoringCache
        uses: boringcache/one@a610ec5a564efd9b360925056dbade04deb5def6 # v1.30.0
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: docker
          trust-policy: publish
          fail-on-cache-error: true
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          SOURCE_SHA: ${{ steps.image.outputs.sha }}
          SOURCE_URL: https://github.com/${{ github.repository }}
          PUBLISH_IMAGE: ${{ github.repository == 'ensdomains/bigname' && github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' }}

      - name: Verify fork image
        if: github.repository != 'ensdomains/bigname' || github.event_name == 'workflow_dispatch'
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
        run: |
          docker run --rm --entrypoint /bin/sh "$IMAGE" -c 'test -x /usr/local/bin/bigname-api && test -x /usr/local/bin/phase-runner'

      - name: Report compiler cache storage
        if: github.repository == 'boringcache/bigname'
        run: boringcache check boringcache/benchmarks bigname-full-ci-rust --json
